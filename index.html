<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Validate Claude .md documents against their JSON Schema in the browser."
    />
    <title>claudeschemas</title>
  </head>
  <body>
    <div class="app" id="app">
      <header class="app-header">
        <h1 class="wordmark">claudeschemas</h1>
        <div class="header-controls">
          <label class="visually-hidden" for="kind-select">Document kind</label>
          <select class="kind-select" id="kind-select"></select>
          <a class="schema-link" id="schema-link" href="#" target="_blank" rel="noreferrer"
            >Schema</a
          >
        </div>
      </header>
      <main class="app-main">
        <section class="pane pane-editor" aria-label="Document">
          <div class="pane-bar">
            <h2 class="pane-title pane-title-mono" id="document-title">Document</h2>
          </div>
          <div class="editor-host" id="editor-host"></div>
        </section>
        <section class="pane pane-panel" aria-label="Problems">
          <div class="pane-bar">
            <h2 class="pane-title">Problems</h2>
            <div class="pane-actions">
              <button class="text-button" type="button" id="load-sample">Load sample</button>
              <button class="text-button" type="button" id="clear-document">Clear</button>
            </div>
          </div>
          <div class="panel" id="diagnostics-panel"></div>
        </section>
      </main>
      <footer class="app-footer">
        <a href="https://github.com/garciasdos/claudeschemas" target="_blank" rel="noreferrer"
          >Open source</a
        >
      </footer>
    </div>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
